syntax = "proto3";

service CategorizerService {
    rpc Categorize(CategoryRequest) returns (CategoryResponse);
}

message CategoryRequest {
    message Text {
        int32 index = 1;
        string text = 2;
    }
    string model_name = 1;
    repeated Text texts = 2;
}

message CategoryResponse {
    enum ErrorCode {
        ERROR_CODE_UNSPECIFIED = 0;
        ERROR_CODE_EMPTY_TEXT = 1;
        ERROR_CODE_TEXT_TOO_LONG = 2;
        ERROR_CODE_NOT_CLASSIFIED = 3;
        ERROR_CODE_INTERNAL = 4;
    }

    message Category {
        message Success {
            string category_name = 1;
            float confidence = 2;
        }
        message Failure {
            ErrorCode code = 1;
            string details = 2;
        }
        int32 index = 1;
        oneof result {
            Success success = 2;
            Failure failure = 3;
        }
    }
    repeated Category categories = 1;
}